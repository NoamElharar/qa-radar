      - { label: 'בודק תוכנה מהיממה האחרונה', url: 'https://il.indeed.com/jobs?q=%D7%91%D7%95%D7%93%D7%A7+%D7%AA%D7%95%D7%9B%D7%A0%D7%94&fromage=1&sort=date' }

