# Region map. A city may belong to more than one region (e.g. ראשון לציון → מרכז + שפלה).
# `aliases` are matched like taxonomy terms (Hebrew prefixes tolerated: "בתל אביב", "לפתח תקווה").
# Coordinates are approximate city centres, used only for the "distance from home" filter.
# `nameIsAmbiguous: true` → the display name is a common word (e.g. "אזור" = "area"), so only aliases are matched.
# Region aliases are only matched against a job's location field; cities are also looked up in the title.

regions:
  center:
    label: מרכז
    aliases: [מרכז, המרכז, אזור המרכז, מרכז הארץ, גוש דן, 'ת"א והמרכז', תל אביב והמרכז, center, central]
  shfela:
    label: שפלה
    aliases: [שפלה, השפלה, אזור השפלה, shfela]
  sharon:
    label: שרון
    aliases: [שרון, השרון, אזור השרון, sharon]
  jerusalem:
    label: ירושלים
    aliases: [ירושלים והסביבה, אזור ירושלים, 'ירושלים ויו"ש', 'יו"ש']
  north:
    label: צפון וחיפה
    aliases: [צפון, הצפון, אזור הצפון, חיפה והצפון, חיפה והקריות, north, haifa area]
  south:
    label: דרום
    aliases: [דרום, הדרום, אזור הדרום, נגב, נגב ואילת, south]
  remote:
    label: מהבית/היברידי
    aliases: [מהבית, עבודה מהבית, remote, היברידי, היברידית, hybrid]

