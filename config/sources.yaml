# QA Radar — source registry. One entry per source; adding a company on a supported platform = one entry.
#
# Fields
#   id          stable identifier (used in job ids — never rename once data exists)
#   name        display name;  company: hiring company shown on cards (direct sources)
#   type        direct | agency | board
#   tier        A (JSON/RSS) | B (HTML) | D (link-out only)  — see docs/PHASE-0-SOURCE-AUDIT.md
#   adapter     platform adapter (collector/src/adapters) or "link-out"
#   everyHours  minimum hours between runs (heavy or low-yield sources run less often)
#   categoryQa  true when the fetched page is already a QA category (ambiguous titles are accepted)
#   quickLinks  one-tap searches shown in the "check manually" panel (link-out sources)
#
# The collector checks robots.txt for every URL it requests (API hosts included) and refuses disallowed ones.

sources:
  # ─────────────────────────── Job boards / aggregators ───────────────────────────
  - id: linkedin
    name: LinkedIn
    type: board
    tier: D
    adapter: link-out
    homepage: https://www.linkedin.com/jobs/
    note: robots.txt אוסר גישה אוטומטית
    quickLinks:
      - { label: 'משרות QA מהיממה האחרונה', url: 'https://www.linkedin.com/jobs/search-results/?keywords=qa&geoId=104243116&distance=0.0&f_TPR=r86400' }
      - { label: 'בודק תוכנה מהיממה האחרונה', url: 'https://www.linkedin.com/jobs/search-results/?keywords=%D7%91%D7%95%D7%93%D7%A7%20%D7%AA%D7%95%D7%9B%D7%A0%D7%94&geoId=104243116&distance=0.0&f_TPR=r86400' }

